spring.application.name=gestionproduits

spring.datasource.url=jdbc:mysql://localhost:3306/gestion-produits
#indique à Spring Boot où se trouve la base de données
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
#affiche les requêtes SQL dans le terminal pour qu'on puisses voir ce que Spring Boot exécute.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
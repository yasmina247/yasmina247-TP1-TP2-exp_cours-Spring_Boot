
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des ventes</title>
</head>
<body>
    <h1>Enregistrer une vente</h1>

    <p th:if="${message}" th:text="${message}"></p>
    <p th:if="${erreur}" th:text="${erreur}"></p>

    <form th:action="@{/ventes}" method="post">
        <label>Produit :</label>

        <select name="produitId" required>
            <option value="">Choisir un produit</option>
            <option th:each="p : ${produits}"
                    th:value="${p.id}"
                    th:text="${p.nom + ' - ' + p.prix + ' DH (stock : ' + (p.quantiteStock != null ? p.quantiteStock : 0) + ')'}">
            </option>
        </select>

        <br><br>

        <label>Quantité :</label>
        <input type="number" name="quantite"
               min="1" required>

        <br><br>

        <button type="submit">Enregistrer la vente</button>
    </form>

    <h2>Historique des ventes</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Numéro</th>
                <th>Produit</th>
                <th>Quantité</th>
                <th>Montant total (DH)</th>
                <th>Vendeur</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="v : ${ventes}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.produit.nom}"></td>
                <td th:text="${v.quantite}"></td>
                <td th:text="${v.montantTotal}"></td>
                <td th:text="${v.vendeur}"></td>
                <td th:text="${#temporals.format(v.dateVente, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
        </tbody>
    </table>

    <p><a th:href="@{/home}">Retour à l'accueil</a></p>
</body>
</html>

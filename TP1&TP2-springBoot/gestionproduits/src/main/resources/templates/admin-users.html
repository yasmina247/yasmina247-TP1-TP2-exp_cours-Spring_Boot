
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des utilisateurs</title>
</head>
<body>
    <h1>Gestion des utilisateurs</h1>

    <p th:if="${message}" th:text="${message}"></p>
    <p th:if="${erreur}" th:text="${erreur}"></p>

    <h2>Ajouter un utilisateur</h2>

    <form th:action="@{/admin/users}" method="post">
        <label>Identifiant :</label>
        <input type="text" name="username" required>
        <br><br>

        <label>Mot de passe :</label>
        <input type="password" name="password"
               minlength="8" required>
        <br><br>

        <label>Rôle :</label>
        <select name="roleName" required>
            <option value="">Choisir un rôle</option>
            <option th:each="r : ${roles}"
                    th:value="${r.name}"
                    th:text="${r.name}">
            </option>
        </select>
        <br><br>

        <button type="submit">Créer l'utilisateur</button>
    </form>

    <h2>Utilisateurs enregistrés</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Identifiant</th>
                <th>Rôle(s)</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td>
                    <span th:each="r, iter : ${u.roles}">
                        <span th:text="${r.name}"></span>
                        <span th:if="${!iter.last}">, </span>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>

    <p><a th:href="@{/admin/dashboard}">Retour à l'administration</a></p>
</body>
</html>

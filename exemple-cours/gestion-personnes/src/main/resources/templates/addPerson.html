<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{add.title}">Ajouter une personne</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: menu}"></div>

<main>
    <h2 th:text="#{add.title}">Ajouter une personne</h2>
    <form th:action="@{/addPerson}" method="post">
        <p>
            <label th:text="#{form.nom}">Nom</label> :
            <input type="text" name="nom" required>
        </p>
        <p>
            <label th:text="#{form.prenom}">Prénom</label> :
            <input type="text" name="prenom" required>
        </p>
        <button type="submit" th:text="#{form.send}">Envoyer</button>
    </form>
</main>

<div th:replace="~{fragments/layout :: copy}"></div>
</body>
</html>

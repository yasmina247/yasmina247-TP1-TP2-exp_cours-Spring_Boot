#Partie 2 : connexion MySQL (XAMPP) + Hibernate
spring.datasource.url=jdbc:mysql://localhost:3306/db_springdata?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# MySQL8Dialect => tables InnoDB (contraintes de clés étrangères pour la table de jointure)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#Partie 3 : Thymeleaf / i18n
# Les vues sont dans src/main/resources/templates (emplacement par défaut, suffixe .html)
#spring.thymeleaf.prefix=/WEB-INF/views/
#spring.thymeleaf.suffix=.html
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
